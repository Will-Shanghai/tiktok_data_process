version: "1.0"
name: tiktok-daily-report-ci
displayName: TikTok Shop Data Tool CI
stages:
- name: build
  displayName: 校验与打包
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: build_python
    displayName: Python 校验与打包
    pythonVersion: 3.9
    commands:
    - python3 -m pip install --upgrade pip
    - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - pip3 install pandas requests python-dotenv openpyxl xlsxwriter pyinstaller
    - python3 -m py_compile main.py
    - python3 -m py_compile sum_daily_order/config/cal_cost_return_jp_daily.py
    - python3 -m py_compile sum_daily_order/config/cal_cost_return_vn_daily.py
    - python3 -m py_compile sum_daily_order/config/cal_cost_return_mx_daily.py
    - python3 -m py_compile sum_daily_conversion/config/cal_product_daily_conversion.py
    - pyinstaller --onedir --name TikTokShopDataTool_linux --hidden-import sum_daily_conversion.config.cal_product_daily_conversion main.py
    - mkdir -p release/dist
    - mkdir -p release/sum_daily_order/config/cache
    - mkdir -p release/sum_daily_order/data
    - mkdir -p release/sum_daily_order/result
    - mkdir -p release/sum_daily_conversion/config
    - mkdir -p release/sum_daily_conversion/data
    - mkdir -p release/sum_daily_conversion/result/logs
    - cp -r dist/* release/dist/ || true
    - cp README.md release/ || true
    - cp TikTokShopDataTool_使用说明.txt release/ || true
    - cp sum_daily_order/config/app_config.xlsx release/sum_daily_order/config/ || true
    - cp sum_daily_conversion/config/config.json release/sum_daily_conversion/config/ || true
    - cp sum_daily_conversion/config/product_sheet_mapping.csv release/sum_daily_conversion/config/ || true
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./release
