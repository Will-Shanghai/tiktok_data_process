name: Build Windows EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version override, for example 1.1.1 or v1.1.1"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.release_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            if (Test-Path VERSION) {
              $inputVersion = (Get-Content VERSION -Raw).Trim()
            } else {
              $inputVersion = "1.1.0"
            }
          }
          $cleanVersion = $inputVersion.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) {
            throw "VERSION 文件为空，请填写版本号。"
          }

          $tagVersion = "v$cleanVersion"
          Set-Content -Path VERSION -Value $cleanVersion -Encoding utf8

          "clean=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag=$tagVersion" >> $env:GITHUB_OUTPUT
          "exe_base=TikTokShopDataTool_${tagVersion}" >> $env:GITHUB_OUTPUT
          "exe_file=TikTokShopDataTool_${tagVersion}.exe" >> $env:GITHUB_OUTPUT
          "package_name=TikTokShopDataTool_${tagVersion}_windows" >> $env:GITHUB_OUTPUT
          "folder_name=TikTokShopDataTool_${tagVersion}" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync app version before build
        shell: pwsh
        run: |
          $versionTag = "${{ steps.version.outputs.tag }}"
          $content = Get-Content main.py -Raw
          $content = [regex]::Replace($content, 'APP_VERSION\s*=\s*"v?[^"]+"', "APP_VERSION = `"$versionTag`"")
          $content = [regex]::Replace($content, 'DEFAULT_APP_VERSION\s*=\s*"v?[^"]+"', "DEFAULT_APP_VERSION = `"$versionTag`"")
          Set-Content -Path main.py -Value $content -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv openpyxl xlsxwriter pyinstaller

      - name: Validate Python files
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile sum_daily_order/config/cal_cost_return_jp_daily.py
          python -m py_compile sum_daily_order/config/cal_cost_return_vn_daily.py
          python -m py_compile sum_daily_order/config/cal_cost_return_mx_daily.py
          python -m py_compile sum_daily_conversion/config/cal_product_daily_conversion.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --name "${{ steps.version.outputs.exe_base }}" --hidden-import sum_daily_conversion.config.cal_product_daily_conversion main.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          $root = "release/${{ steps.version.outputs.folder_name }}"

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/config/cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_JP/local" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_JP/cross_border" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_JP/direct_old" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_JP/direct_new" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_VN/local" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_VN/cross_border" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_MX/local" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_MX/direct_old" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/data/data_MX/direct_new" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_order/result" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_conversion/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_conversion/data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_conversion/result" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/sum_daily_conversion/result/logs" | Out-Null

          if (-not (Test-Path "TikTokShopDataTool_使用说明.txt")) {
            throw "缺少 TikTokShopDataTool_使用说明.txt。请确认该文件已提交到 Git 仓库。"
          }

          Copy-Item "dist/${{ steps.version.outputs.exe_file }}" "$root/"
          Copy-Item "TikTokShopDataTool_使用说明.txt" "$root/"
          Copy-Item "VERSION" "$root/"
          Copy-Item "sum_daily_order/config/app_config.xlsx" "$root/sum_daily_order/config/"
          Copy-Item "sum_daily_order/config/.env.example" "$root/sum_daily_order/config/" -Force
          Copy-Item "sum_daily_conversion/config/config.json" "$root/sum_daily_conversion/config/" -Force
          Copy-Item "sum_daily_conversion/config/product_sheet_mapping.csv" "$root/sum_daily_conversion/config/" -Force
          Copy-Item "sum_daily_order/config/cache/*" "$root/sum_daily_order/config/cache/" -Force -ErrorAction SilentlyContinue

      - name: Create zip package
        id: package
        shell: pwsh
        run: |
          $zipPath = "release/${{ steps.version.outputs.package_name }}.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "release/${{ steps.version.outputs.folder_name }}" -DestinationPath $zipPath
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: ${{ steps.package.outputs.zip_path }}

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TikTok Shop Data Tool ${{ steps.version.outputs.tag }}
          files: ${{ steps.package.outputs.zip_path }}
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            TikTok Shop 数据工具 Windows 版本

            下载说明：
            1. 请在本页面下方 Assets 区域下载 `${{ steps.version.outputs.package_name }}.zip`。
            2. 下载后先解压，再双击里面的 `TikTokShopDataTool_${{ steps.version.outputs.tag }}.exe` 运行。
            3. 订单 CSV 文件请放到对应店铺目录，例如 `sum_daily_order/data/data_JP/direct_old`、`sum_daily_order/data/data_JP/direct_new` 或 `sum_daily_order/data/data_VN/cross_border`。
            4. 订单报表会生成到 `sum_daily_order/result` 文件夹；商品每日转化统计会生成到 `sum_daily_conversion/result`。
            5. 如果订单日报需要在线读取飞书配置，请把 `.env` 放到 `sum_daily_order/config/.env`，格式参考 `sum_daily_order/config/.env.example`。

            注意：
            - 不要下载 Source code 压缩包，那个是 GitHub 自动生成的源码包，不是给同事使用的工具包。
            - 如果浏览器提示文件风险，请确认下载的是上面的 Windows 工具 zip 包。
            - 工具包默认不内置真实 `.env`；如需在线刷新飞书配置，请自行放入 `sum_daily_order/config/.env`。

      - name: Notify Feishu
        if: ${{ always() }}
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          JOBS_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEISHU_BOT_WEBHOOK)) {
            Write-Host "FEISHU_BOT_WEBHOOK 未配置，跳过飞书通知。"
            exit 0
          }

          $today = Get-Date -Format "yyyy-MM-dd"

          if ($env:JOB_STATUS -eq "success") {
            $text = @(
              "提醒：TikTok Shop Data Tool Windows 有更新",
              "",
              "版本：$($env:VERSION_TAG)",
              "Release 下载：$($env:RELEASE_URL)",
              "下载包：请打开 Release 页面，在 Assets 区域下载 TikTokShopDataTool_$($env:VERSION_TAG)_windows.zip",
              "说明：如需在线读取飞书配置，请把 .env 放到 sum_daily_order/config/.env，格式参考 sum_daily_order/config/.env.example",
              "访问说明：GitHub 可能需要外网环境才能打开",
              "时间：$today"
            ) -join "`n"
          } else {
            $reason = "未知错误"
            try {
              $headers = @{
                Authorization = "Bearer $($env:GH_TOKEN)"
                Accept        = "application/vnd.github+json"
                "User-Agent"  = "GitHub Actions"
              }
              $jobsResponse = Invoke-RestMethod -Uri $env:JOBS_API_URL -Headers $headers -Method Get
              foreach ($job in $jobsResponse.jobs) {
                foreach ($step in $job.steps) {
                  if ($step.conclusion -eq "failure") {
                    $reason = "$($job.name) / $($step.name)"
                    break
                  }
                }
                if ($reason -ne "未知错误") {
                  break
                }
                if ($job.conclusion -eq "failure") {
                  $reason = $job.name
                  break
                }
              }
            } catch {
              $reason = "获取失败原因时出错"
            }
            $text = @(
              "告警：TikTok Shop Data Tool Windows 打包失败",
              "",
              "原因：$reason",
              "时间：$today"
            ) -join "`n"
          }
          $body = @{
            msg_type = "text"
            content = @{
              text = $text
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:FEISHU_BOT_WEBHOOK -Method Post -ContentType "application/json" -Body $body
