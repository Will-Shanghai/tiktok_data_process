name: Build Windows EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version override, for example 1.1.1 or v1.1.1"
        required: false
        type: string
      upload_qiniu:
        description: "Upload package to Qiniu"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.release_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            if (Test-Path VERSION) {
              $inputVersion = (Get-Content VERSION -Raw).Trim()
            } else {
              $inputVersion = "1.1.0"
            }
          }
          $cleanVersion = $inputVersion.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) {
            throw "VERSION 文件为空，请填写版本号。"
          }

          $tagVersion = "v$cleanVersion"
          Set-Content -Path VERSION -Value $cleanVersion -Encoding utf8

          "clean=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag=$tagVersion" >> $env:GITHUB_OUTPUT
          "exe_base=TikTokDailyReport_${tagVersion}" >> $env:GITHUB_OUTPUT
          "exe_file=TikTokDailyReport_${tagVersion}.exe" >> $env:GITHUB_OUTPUT
          "package_name=TikTokDailyReport_${tagVersion}_windows" >> $env:GITHUB_OUTPUT
          "folder_name=TikTokDailyReport_${tagVersion}" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync app version before build
        shell: pwsh
        run: |
          $versionTag = "${{ steps.version.outputs.tag }}"
          $content = Get-Content main.py -Raw
          $content = [regex]::Replace($content, 'APP_VERSION\s*=\s*"v?[^"]+"', "APP_VERSION = `"$versionTag`"")
          $content = [regex]::Replace($content, 'DEFAULT_APP_VERSION\s*=\s*"v?[^"]+"', "DEFAULT_APP_VERSION = `"$versionTag`"")
          Set-Content -Path main.py -Value $content -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv openpyxl xlsxwriter pyinstaller qiniu

      - name: Validate Python files
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile sum_daily_order/config/cal_cost_return_jp_daily.py
          python -m py_compile sum_daily_order/config/cal_cost_return_vn_daily.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --name "${{ steps.version.outputs.exe_base }}" main.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          $root = "release/${{ steps.version.outputs.folder_name }}"

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/config/cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/data_JP/local" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/data_JP/cross-border" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/data_JP/direct" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/data_VN/local" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/data_VN/cross_border" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/result" | Out-Null

          Copy-Item "dist/${{ steps.version.outputs.exe_file }}" "$root/"
          Copy-Item "TikTokDailyReport_使用说明.txt" "$root/"
          Copy-Item "VERSION" "$root/"
          Copy-Item "sum_daily_order/config/app_config.xlsx" "$root/config/"

      - name: Create zip package
        id: package
        shell: pwsh
        run: |
          $zipPath = "release/${{ steps.version.outputs.package_name }}.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "release/${{ steps.version.outputs.folder_name }}" -DestinationPath $zipPath
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: ${{ steps.package.outputs.zip_path }}

      - name: Upload package to Qiniu
        id: qiniu
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_qiniu == 'true' }}
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_REGION: ${{ secrets.QINIU_REGION }}
          QINIU_DOWNLOAD_DOMAIN: ${{ secrets.QINIU_DOWNLOAD_DOMAIN }}
          QINIU_KEY_PREFIX: ${{ secrets.QINIU_KEY_PREFIX }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QINIU_ACCESS_KEY) -or
              [string]::IsNullOrWhiteSpace($env:QINIU_SECRET_KEY) -or
              [string]::IsNullOrWhiteSpace($env:QINIU_BUCKET)) {
            throw "七牛 Secrets 未配置完整，请至少提供 QINIU_ACCESS_KEY、QINIU_SECRET_KEY、QINIU_BUCKET。"
          }

          $keyPrefix = $env:QINIU_KEY_PREFIX
          if ([string]::IsNullOrWhiteSpace($keyPrefix)) {
            $keyPrefix = "tiktok-daily-report"
          }

          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $zipName = [System.IO.Path]::GetFileName($zipPath)
          $versionTag = "${{ steps.version.outputs.tag }}"
          $dateStamp = Get-Date -Format "yyyyMMdd"
          $archiveKey = "$keyPrefix/archive/$dateStamp/$zipName"
          $latestKey = "$keyPrefix/latest/TikTokDailyReport_latest.zip"

          $script = @(
            'from pathlib import Path',
            'from urllib.parse import quote',
            'import os',
            '',
            'from qiniu import Auth, put_file',
            '',
            '',
            'def build_download_url(domain: str, key: str) -> str:',
            '    domain = (domain or "").strip()',
            '    if not domain:',
            '        return ""',
            '    if domain.startswith("http://") or domain.startswith("https://"):',
            '        base = domain.rstrip("/")',
            '    else:',
            '        base = "https://" + domain.rstrip("/")',
            '    return base + "/" + quote(key)',
            '',
            '',
            'access_key = os.environ["QINIU_ACCESS_KEY"]',
            'secret_key = os.environ["QINIU_SECRET_KEY"]',
            'bucket_name = os.environ["QINIU_BUCKET"]',
            'download_domain = os.environ.get("QINIU_DOWNLOAD_DOMAIN", "").strip()',
            'file_path = Path(os.environ["QINIU_UPLOAD_FILE"]).resolve()',
            'archive_key = os.environ["QINIU_ARCHIVE_KEY"]',
            'latest_key = os.environ["QINIU_LATEST_KEY"]',
            '',
            'q = Auth(access_key, secret_key)',
            '',
            'for object_key in (archive_key, latest_key):',
            '    token = q.upload_token(bucket_name, object_key, 3600)',
            '    ret, info = put_file(token, object_key, str(file_path), version="v2")',
            '    status_code = getattr(info, "status_code", None)',
            '    if status_code != 200:',
            '        raise RuntimeError(f"Qiniu upload failed for {object_key}, status={status_code}, ret={ret}")',
            '',
            'archive_url = build_download_url(download_domain, archive_key)',
            'latest_url = build_download_url(download_domain, latest_key)',
            '',
            'github_output = Path(os.environ["GITHUB_OUTPUT"])',
            'with github_output.open("a", encoding="utf-8") as fh:',
            '    fh.write(f"archive_key={archive_key}\\n")',
            '    fh.write(f"latest_key={latest_key}\\n")',
            '    fh.write(f"archive_url={archive_url}\\n")',
            '    fh.write(f"latest_url={latest_url}\\n")'
          ) -join "`n"

          Set-Content -Path qiniu_upload.py -Value $script -Encoding utf8
          $env:QINIU_UPLOAD_FILE = (Resolve-Path $zipPath).Path
          $env:QINIU_ARCHIVE_KEY = $archiveKey
          $env:QINIU_LATEST_KEY = $latestKey
          python qiniu_upload.py
          Remove-Item qiniu_upload.py -Force

      - name: Notify Feishu
        if: ${{ always() }}
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          QINIU_ARCHIVE_URL: ${{ steps.qiniu.outputs.archive_url }}
          QINIU_LATEST_URL: ${{ steps.qiniu.outputs.latest_url }}
          JOBS_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEISHU_BOT_WEBHOOK)) {
            Write-Host "FEISHU_BOT_WEBHOOK 未配置，跳过飞书通知。"
            exit 0
          }

          $today = Get-Date -Format "yyyy-MM-dd"

          if ($env:JOB_STATUS -eq "success") {
            if (-not [string]::IsNullOrWhiteSpace($env:QINIU_LATEST_URL)) {
              $downloadLine = "下载链接：$($env:QINIU_LATEST_URL)"
            } elseif (-not [string]::IsNullOrWhiteSpace($env:QINIU_ARCHIVE_URL)) {
              $downloadLine = "下载链接：$($env:QINIU_ARCHIVE_URL)"
            } else {
              $downloadLine = "下载链接：已打包成功，但七牛下载链接暂未生成"
            }
            $text = @(
              "告警：TikTok Daily Report Windows 打包成功",
              "",
              "版本：$($env:VERSION_TAG)",
              $downloadLine,
              "时间：$today"
            ) -join "`n"
          } else {
            $reason = "未知错误"
            try {
              $headers = @{
                Authorization = "Bearer $($env:GH_TOKEN)"
                Accept        = "application/vnd.github+json"
                "User-Agent"  = "GitHub Actions"
              }
              $jobsResponse = Invoke-RestMethod -Uri $env:JOBS_API_URL -Headers $headers -Method Get
              foreach ($job in $jobsResponse.jobs) {
                foreach ($step in $job.steps) {
                  if ($step.conclusion -eq "failure") {
                    $reason = "$($job.name) / $($step.name)"
                    break
                  }
                }
                if ($reason -ne "未知错误") {
                  break
                }
                if ($job.conclusion -eq "failure") {
                  $reason = $job.name
                  break
                }
              }
            } catch {
              $reason = "获取失败原因时出错"
            }
            $text = @(
              "告警：TikTok Daily Report Windows 打包失败",
              "",
              "原因：$reason",
              "时间：$today"
            ) -join "`n"
          }
          $body = @{
            msg_type = "text"
            content = @{
              text = $text
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:FEISHU_BOT_WEBHOOK -Method Post -ContentType "application/json" -Body $body
